name: Publish ModelScope Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an upload/publication already in progress.
concurrency:
  group: modelscope-gallery-cb1503c2
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Queued runs publish the latest main, rather than an older event commit.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gallery-sync.txt
      - name: Install build and publishing dependencies
        run: python -m pip install -r requirements-gallery-sync.txt
      - name: Sync README welcome page and test publisher
        # README is the source of truth for the Gallery welcome page.
        run: |
          python scripts/sync_index.py
          python -m unittest discover -s tests -v
      - name: Rebuild HTML without executing notebooks
        run: python build_html.py
      - name: Install browser for responsive layout checks
        run: python -m playwright install --with-deps chromium
      - name: Check mobile navigation, page width and code scrolling
        run: python scripts/check_mobile.py course_content/html
      - name: Validate Gallery file selection
        run: python scripts/sync_gallery.py --dry-run
      - name: Upload and publish existing Gallery
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_GALLERY_OWNER: NVIDIA_Training_and_Certification
          MODELSCOPE_GALLERY_ID: cb1503c2-1458-4f67-b9c3-bd505091cb47
        run: python scripts/sync_gallery.py
